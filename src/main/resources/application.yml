server:
  port: 8080
  tomcat:
    accesslog:
      # 请求级日志：谁在什么时候调了哪个接口、状态码、耗时
      enabled: true
      # 嵌入式 Tomcat 的 catalina.base 是随机临时目录，必须用绝对路径才不会写丢
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      # %h 来源 %t 时间 "%r" 请求行 %s 状态码 %b 响应字节 %{ms}T 耗时(毫秒)
      # 注意：%D 在 Tomcat 10 里是微秒，别拿它当毫秒用
      pattern: '%h %t "%r" %s %b %{ms}Tms'
      # 关闭缓冲，写完即刷，方便 tail -f
      buffered: false
      rotate: true

spring:
  # 默认只有 1 个调度线程：flush / 落盘 / 对账 / 发布扫描共用
  # 一个任务卡住会连带拖停其它任务，所以留出余量
  task:
    scheduling:
      pool:
        size: 2

  application:
    name: maibao-technology-application
  # 本地密码等敏感配置放 application-local.yml（已在 .gitignore），缺失时不影响启动
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/maibao_technology_application?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: localhost
    port: 5672
    username: maibao
    password: maibao
    # 独立 vhost；注意名字本身带前导斜杠，不是 maibao
    virtual-host: /maibao
    # 生产端可靠性：确认回调 + 未路由消息退回
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        # 任务消费者是 IO 密集（调模型），吞吐靠并发而不是预取：
        # 4 个消费者线程起步，忙时可扩到 8；prefetch 每线程 2 条，未确认窗口约 8 条。
        concurrency: 4
        max-concurrency: 8
        prefetch: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  # 异步任务消费者使用的默认模型与用户标识（消息里没带时使用）
  task:
    # 任务链路当前停用：等长任务模型接入后，按适配器能力再开
    enabled: false
    model: mock:echo
    user-id: async-task

  mq:
    # 队列类型：quorum（Raft 复制，RabbitMQ 4.x 推荐）/ classic
    # 注意：切类型前必须删掉已有的同名 classic 队列，否则声明会 PRECONDITION_FAILED
    queue-type: quorum
    # outbox 作为"强投递备用组件"保留，默认关闭（成本链路已改 Redis）
    outbox-enabled: false
    exchange: maibao.task.exchange
    queue: maibao.task.queue
    routing-key: maibao.task
    # 死信：重试耗尽的 nack 会路由到这里，而不是消失
    dlx-exchange: maibao.task.dlx
    dlq-queue: maibao.task.dlq
    dlq-routing-key: maibao.task.dlq
    # 消费失败后的重试次数上限，超过后写 failed_task 并放弃消息
    max-retries: 3
    # outbox：扫描间隔 / 对账间隔 / 重试上限 / 消费回执超时 / 抢占租约
    outbox-scan-ms: 2000
    outbox-reconcile-ms: 60000
    outbox-reconcile-initial-delay-ms: 60000
    outbox-max-attempts: 5
    consume-timeout-seconds: 300
    outbox-lease-seconds: 30
  publish:
    # 真实场景这里是调用发布接口；本项目用固定耗时模拟执行
    work-duration-ms: 200
    # 停留在 PUBLISHING 超过该秒数视为卡死，由恢复任务标记为 FAILED
    stuck-timeout-seconds: 60
    scan-interval-ms: 5000
    recovery-interval-ms: 30000
    executor:
      core-size: 4
      max-size: 8
      queue-capacity: 100
  security:
    # 本地固定密钥；部署时应放 KMS / 环境变量
    secret: "maibao-app-secret-0123456789abcdef"
  provider:
    openai:
      base-url: https://api.openai.com/v1
      # 不建库里的密钥时，可直接配在 yml 或环境变量里
      api-key: ${OPENAI_API_KEY:}
      # 超时分层：建连 / 首字节 / 整体
      connect-timeout-ms: 5000
      first-byte-timeout-ms: 30000
      overall-timeout-ms: 300000
  cost:
    currency: CNY
    # 账期时区，必须与 JDBC 的 serverTimezone 一致
    zone: Asia/Shanghai
    # 落盘间隔与日结
    flush-ms: 60000
    settle-cron: "0 5 0 * * *"
    reconcile-ms: 300000
    # 用户配额（超限直接拒绝，抛业务码 4029）
    quota:
      enabled: true
      daily-per-user: 100.0
    # Redis 累加：一个日期一个 Hash，TTL 兜底
    redis:
      key-prefix: "maibao:cost"
      ttl-days: 3
    # 明细批量写
    detail:
      # mq: 攒批发 MQ（崩溃不丢、可重投）；local: 本地直写（不依赖 broker）
      mode: mq
      flush-ms: 200
      batch-size: 2000
      queue-capacity: 20000
      retain-days: 7
      exchange: maibao.detail.exchange
      queue: maibao.detail.queue
      routing-key: maibao.detail
      dlx-exchange: maibao.detail.dlx
      dlq-queue: maibao.detail.dlq
      dlq-routing-key: maibao.detail.dlq
      max-retries: 3
      # 发布未确认时的重新入队次数，超过就写 ERROR 日志兜底
      publish-retries: 3
      # 死信队列深度巡检间隔（毫秒）
      dlq-check-ms: 60000
      retry-exchange: maibao.detail.retry.exchange
      # 退避档位：第 1 次失败等 5s，第 2 次 30s，第 3 次 2min（队列级 TTL + 死信回主队列）
      retry-delays-ms: 5000,30000,120000


    # 单价：key 是 model 的冒号前缀（mock / openai），取不到用 default
    pricing:
      default:
        input-per-1k: 0.002
        output-per-1k: 0.006
      mock:
        input-per-1k: 0.001
        output-per-1k: 0.002
      openai:
        input-per-1k: 0.15
        output-per-1k: 0.60
