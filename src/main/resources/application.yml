server:
  port: 8080
  tomcat:
    accesslog:
      # 请求级日志：谁在什么时候调了哪个接口、状态码、耗时
      enabled: true
      # 嵌入式 Tomcat 的 catalina.base 是随机临时目录，必须用绝对路径才不会写丢
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      # %h 来源 %t 时间 "%r" 请求行 %s 状态码 %b 响应字节 %{ms}T 耗时(毫秒)
      # 注意：%D 在 Tomcat 10 里是微秒，别拿它当毫秒用
      pattern: '%h %t "%r" %s %b %{ms}Tms'
      # 关闭缓冲，写完即刷，方便 tail -f
      buffered: false
      rotate: true

spring:
  application:
    name: maibao-technology-application
  datasource:
    url: jdbc:h2:file:./data/maibao;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: maibao
    password: maibao
    # 独立 vhost；注意名字本身带前导斜杠，不是 maibao
    virtual-host: /maibao
    # 生产端可靠性：确认回调 + 未路由消息退回
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  mq:
    exchange: maibao.task.exchange
    queue: maibao.task.queue
    routing-key: maibao.task
    # 消费失败后的重试次数上限，超过后写 failed_task 并放弃消息
    max-retries: 3
  publish:
    # 真实场景这里是调用发布接口；本项目用固定耗时模拟执行
    work-duration-ms: 200
    # 停留在 PUBLISHING 超过该秒数视为卡死，由恢复任务标记为 FAILED
    stuck-timeout-seconds: 60
    scan-interval-ms: 5000
    recovery-interval-ms: 30000
    executor:
      core-size: 4
      max-size: 8
      queue-capacity: 100
  security:
    # 本地固定密钥；部署时应放 KMS / 环境变量
    secret: "maibao-app-secret-0123456789abcdef"
  provider:
    openai:
      base-url: https://api.openai.com/v1
      timeout-ms: 60000

logging:
  level:
    com.maibao.tech: DEBUG
  file:
    # 控制台照常输出，同时落盘到 logs/app.log
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
