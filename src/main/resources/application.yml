server:
  port: 8080
  tomcat:
    accesslog:
      # 请求级日志：谁在什么时候调了哪个接口、状态码、耗时
      enabled: true
      # 嵌入式 Tomcat 的 catalina.base 是随机临时目录，必须用绝对路径才不会写丢
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      # %h 来源 %t 时间 "%r" 请求行 %s 状态码 %b 响应字节 %{ms}T 耗时(毫秒)
      # 注意：%D 在 Tomcat 10 里是微秒，别拿它当毫秒用
      pattern: '%h %t "%r" %s %b %{ms}Tms'
      # 关闭缓冲，写完即刷，方便 tail -f
      buffered: false
      rotate: true

spring:
  application:
    name: maibao-technology-application
  datasource:
    url: jdbc:h2:file:./data/maibao;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    rabbit:
      # app.mq.enabled=false 时应用并不依赖 broker，健康检查不应因 broker 不可达而整体 DOWN
      enabled: ${app.mq.enabled}

app:
  # 默认走真实异步链路；本机没有 RabbitMQ 时改成 false，会自动降级为同步执行
  mq:
    enabled: true
    exchange: maibao.task.exchange
    queue: maibao.task.queue
    routing-key: maibao.task
  security:
    # 本地固定密钥；部署时应放 KMS / 环境变量
    secret: "maibao-app-secret-0123456789abcdef"
  provider:
    openai:
      base-url: https://api.openai.com/v1
      timeout-ms: 60000

logging:
  level:
    com.maibao.tech: DEBUG
  file:
    # 控制台照常输出，同时落盘到 logs/app.log
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
