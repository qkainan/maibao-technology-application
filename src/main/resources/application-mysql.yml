# 可选：想用 MySQL 演示 EXPLAIN / 索引时启用
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 前提：
#   1) 本地有 MySQL，并建库：CREATE DATABASE maibao DEFAULT CHARSET utf8mb4;
#   2) 打开 pom.xml 里 mysql-connector-j 那段注释
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/maibao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
